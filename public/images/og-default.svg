<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#faf6f1"/>
  <!-- 上部アクセントライン -->
  <rect x="0" y="0" width="1200" height="8" fill="#6e4830"/>
  <!-- 左側の装飾（土の柱） -->
  <rect x="0" y="0" width="12" height="630" fill="#d0b090"/>

  <!-- 葉のシンボル（中央左寄り） -->
  <g transform="translate(160, 280)">
    <path d="M0 80 C0 80 -50 40 -50 -10 C-50 -45 -25 -65 0 -65 C25 -65 50 -45 50 -10 C50 40 0 80 0 80Z" fill="#96b28a" opacity="0.4"/>
    <line x1="0" y1="80" x2="0" y2="20" stroke="#6e4830" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- メインテキスト -->
  <text x="600" y="260" font-family="serif" font-size="72" font-weight="bold" fill="#3b261a" text-anchor="middle" dominant-baseline="middle">
    ハニヤス合同会社
  </text>

  <!-- サブテキスト -->
  <text x="600" y="360" font-family="sans-serif" font-size="32" fill="#8a5c3d" text-anchor="middle">
    人創りで、豊かな未来を
  </text>

  <!-- URL -->
  <text x="600" y="560" font-family="sans-serif" font-size="24" fill="#a67350" text-anchor="middle" letter-spacing="2">
    haniyasu.com
  </text>

  <!-- 下部ライン -->
  <rect x="480" y="470" width="240" height="2" fill="#d0b090"/>
</svg>
